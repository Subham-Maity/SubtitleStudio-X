[package]
name = "subtitle_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["skia"]
skia = ["dep:skia-safe"]
fallback-tiny = ["dep:tiny-skia", "dep:cosmic-text"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
skia-safe = { version = "0.158.0", features = ["textlayout"], optional = true }
tiny-skia = { version = "0.12.0", optional = true }
cosmic-text = { version = "0.19.0", optional = true }

[dev-dependencies]
image.workspace = true

