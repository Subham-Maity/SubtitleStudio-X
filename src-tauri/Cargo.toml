[package]
name = "subtitle-studio-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "subtitle_studio_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
vulkan = ["studio_core/vulkan"]
cuda = ["studio_core/cuda"]
metal = ["studio_core/metal"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
subtitle_render = { path = "../crates/subtitle_render" }
studio_core = { path = "../crates/studio_core" }
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-shell = "2.6.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
